<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <title>GradeFlow - Calculadora de Notas e Faltas</title>
    <meta
      name="description"
      content="GradeFlow é uma calculadora inteligente de notas e faltas para estudantes. Calcule sua média, descubra a nota necessária para passar e acompanhe seu desempenho acadêmico."
    />
    <meta
      name="keywords"
      content="gradeflow, notas, faltas, calculadora, FIAP, média, desempenho acadêmico, estudante, gs"

    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#ed145b" />
    <meta name="color-scheme" content="light dark" />

    <meta property="og:title" content="GradeFlow - Calculadora de Notas e Faltas" />

      property="og:description"
      content="Descubra a nota que você precisa tirar para passar. Calcule sua média com precisão."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gradeflow.com" />
    <meta property="og:image" content="https://gradeflow.com/og-image.png" />
    <meta property="og:locale" content="pt_BR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GradeFlow - Calculadora de Notas e Faltas" />
    <meta
      name="twitter:description"
      content="Descubra a nota que você precisa tirar para passar."
    />
    <meta name="twitter:image" content="https://gradeflow.com/twitter-image.png" />

    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:;"
    />
